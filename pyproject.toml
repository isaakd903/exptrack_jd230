[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "isaakd903-exptrack_jd230"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出实验管理与追踪工程师·训练数据配比与课程学习上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "isaakd903" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://isaakd903.github.io"
Repository = "https://github.com/isaakd903/exptrack_jd230"
Issues = "https://github.com/isaakd903/exptrack_jd230/issues"

[project.scripts]
exptrack_jd230 = "exptrack_jd230:main"

[tool.setuptools]
py-modules = ["exptrack_jd230"]
